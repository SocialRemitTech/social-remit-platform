# Local development stack.
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Reset:   docker compose down -v     (the -v also deletes the database volume)
#
# Nothing here touches AWS or costs money. LocalStack emulates the AWS services
# we use so you can develop queues and events without an account.
#
# ── Host ports ──────────────────────────────────────────────────────────────
# PostgreSQL defaults to 5433 on the host, NOT the usual 5432. Many machines
# already run PostgreSQL on 5432 (Postgres.app, Homebrew, conda), and Docker
# cannot bind a port that something else already holds.
#
# Inside the Docker network the containers still use their standard ports, and
# scripts/dev-db.sh runs psql inside the container — so the host port only
# matters when you connect from your own machine.
#
# Override any of these in a .env file next to this one. See .env.example.

name: socialremit

services:

  postgres:
    image: postgres:16-alpine
    container_name: socialremit-postgres
    environment:
      POSTGRES_USER: socialremit
      POSTGRES_PASSWORD: localdev_only_not_a_real_secret
      POSTGRES_DB: socialremit_dev
    ports:
      - "${SR_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Scripts wait on this before applying migrations. Without it, dev-db.sh
      # races the container's own startup and fails on a fresh machine.
      test: ["CMD-SHELL", "pg_isready -U socialremit -d socialremit_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: socialremit-redis
    ports:
      - "${SR_REDIS_PORT:-6380}:6379"
    # No persistence locally: Redis holds only short-lived state (rate-limit
    # counters, caches). Anything that must survive a restart belongs in Postgres.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: socialremit-localstack
    ports:
      - "${SR_LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sqs,sns,events,s3,secretsmanager,kms
      DEBUG: "0"
      AWS_DEFAULT_REGION: eu-west-2
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  localstack-data:
